<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">

    <title>Нет подключения к Интернету</title>

    <style>
        :root {
            --background: #fff;
            --text: #202124;
            --secondary: #5f6368;
            --button: #1a73e8;
            --button-hover: #185abc;
            --code: #5f6368;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background: #202124;
                --text: #e8eaed;
                --secondary: #9aa0a6;
                --button: #8ab4f8;
                --button-hover: #aecbfa;
                --code: #9aa0a6;
            }
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            font-family:
                Arial,
                Helvetica,
                sans-serif;
            background: var(--background);
            color: var(--text);
        }

        body {
            min-height: 100vh;
        }

        /* =========================
           FAKE CHROME ERROR PAGE
           ========================= */

        #error-page {
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .interstitial-wrapper {
            width: 100%;
            max-width: 600px;
            margin-top: 15vh;
            padding: 0 24px;
        }

        .icon {
            width: 72px;
            height: 72px;
            margin-bottom: 38px;
            color: var(--secondary);
        }

        .icon svg {
            width: 100%;
            height: 100%;
        }

        h1 {
            margin: 0 0 18px 0;
            font-size: 28px;
            line-height: 1.3;
            font-weight: 400;
            letter-spacing: -0.3px;
        }

        p {
            margin: 0 0 12px 0;
            color: var(--secondary);
            font-size: 16px;
            line-height: 1.5;
        }

        .error-code {
            margin-top: 24px;
            color: var(--code);
            font-size: 13px;
            font-family: monospace;
        }

        .nav-wrapper {
            margin-top: 32px;
        }

        #reload {
            border: none;
            border-radius: 22px;
            padding: 11px 24px;

            background: var(--button);
            color: white;

            font-size: 14px;
            font-weight: 500;

            cursor: pointer;

            transition:
                background 0.15s,
                transform 0.1s;
        }

        #reload:hover {
            background: var(--button-hover);
        }

        #reload:active {
            transform: scale(0.97);
        }

        /* =========================
           67 SCREEN
           ========================= */

        #boom {
            position: fixed;
            inset: 0;

            display: none;

            overflow: hidden;

            background: #000;

            z-index: 999999;
        }

        #boom.active {
            display: block;
        }

        #rain {
            position: absolute;
            inset: 0;

            overflow: hidden;
        }

        .number {
            position: absolute;

            top: -100px;

            color: #00ff55;

            font-family:
                "Courier New",
                monospace;

            font-weight: bold;

            font-size: 22px;

            white-space: nowrap;

            text-shadow:
                0 0 5px #00ff55,
                0 0 12px #00ff55;

            user-select: none;

            animation-name: fall;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
        }

        @keyframes fall {
            from {
                transform:
                    translateY(-120px)
                    rotate(0deg);
                opacity: 1;
            }

            to {
                transform:
                    translateY(calc(100vh + 150px))
                    rotate(360deg);
                opacity: 0.15;
            }
        }

        #big67 {
            position: absolute;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            color: #00ff55;

            font-family:
                "Arial Black",
                Impact,
                sans-serif;

            font-size: clamp(150px, 35vw, 500px);

            font-weight: 900;

            line-height: 1;

            text-shadow:
                0 0 10px #00ff55,
                0 0 30px #00ff55,
                0 0 70px #00ff55,
                0 0 120px #00ff55;

            z-index: 10;

            user-select: none;

            animation: pulse 1.2s infinite alternate;
        }

        @keyframes pulse {
            from {
                transform:
                    translate(-50%, -50%)
                    scale(1);
            }

            to {
                transform:
                    translate(-50%, -50%)
                    scale(1.04);
            }
        }

        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 600px) {

            .interstitial-wrapper {
                margin-top: 10vh;
                padding: 0 28px;
            }

            .icon {
                width: 64px;
                height: 64px;
                margin-bottom: 30px;
            }

            h1 {
                font-size: 24px;
            }

            p {
                font-size: 15px;
            }

            .number {
                font-size: 18px;
            }

            #big67 {
                font-size: 45vw;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         FAKE INTERNET ERROR
         ========================= -->

    <div id="error-page">

        <div class="interstitial-wrapper">

            <!-- Network error icon -->
            <div class="icon">
                <svg viewBox="0 0 72 72"
                     fill="none"
                     xmlns="http://www.w3.org/2000/svg">

                    <circle
                        cx="36"
                        cy="36"
                        r="25"
                        stroke="currentColor"
                        stroke-width="3"/>

                    <path
                        d="M11 36H61"
                        stroke="currentColor"
                        stroke-width="3"/>

                    <path
                        d="M36 11C28 19 28 53 36 61"
                        stroke="currentColor"
                        stroke-width="3"/>

                    <path
                        d="M36 11C44 19 44 53 36 61"
                        stroke="currentColor"
                        stroke-width="3"/>

                    <path
                        d="M10 10L62 62"
                        stroke="currentColor"
                        stroke-width="4"
                        stroke-linecap="round"/>
                </svg>
            </div>

            <div id="main-message">

                <h1>
                    Нет подключения к Интернету
                </h1>

                <p>
                    Проверьте подключение к сети.
                </p>

                <p>
                    Проверьте сетевые кабели, модем и маршрутизатор.
                </p>

                <div class="error-code">
                    ERR_INTERNET_DISCONNECTED
                </div>

            </div>

            <div class="nav-wrapper">
                <button id="reload">
                    Перезагрузить
                </button>
            </div>

        </div>

    </div>


    <!-- =========================
         67 SCREEN
         ========================= -->

    <div id="boom">

        <div id="rain"></div>

        <div id="big67">
            67
        </div>

    </div>


    <!-- =========================
         MP3
         ========================= -->

    <audio
        id="sound67"
        src="67.mp3"
        preload="auto"
        loop>
    </audio>


    <script>

        const reloadButton =
            document.getElementById("reload");

        const errorPage =
            document.getElementById("error-page");

        const boom =
            document.getElementById("boom");

        const rain =
            document.getElementById("rain");

        const sound =
            document.getElementById("sound67");

        let activated = false;


        /*
         * Создаём один падающий 67
         */
        function createNumber() {

            const number =
                document.createElement("div");

            number.className = "number";

            number.textContent = "67";

            number.style.left =
                Math.random() * 100 + "%";

            number.style.fontSize =
                (14 + Math.random() * 28) + "px";

            number.style.animationDuration =
                (2 + Math.random() * 5) + "s";

            number.style.animationDelay =
                (Math.random() * 1.5) + "s";

            number.style.opacity =
                0.3 + Math.random() * 0.7;

            rain.appendChild(number);

            /*
             * Удаляем после падения,
             * чтобы страница не забивалась элементами.
             */
            setTimeout(() => {
                number.remove();
            }, 8000);
        }


        /*
         * Запускаем дождь
         */
        function startRain() {

            /*
             * Первоначальная масса 67
             */
            for (let i = 0; i < 120; i++) {
                createNumber();
            }

            /*
             * Постоянно добавляем новые
             */
            setInterval(() => {

                for (let i = 0; i < 5; i++) {
                    createNumber();
                }

            }, 180);
        }


        /*
         * Главная функция
         */
        async function activate() {

            if (activated) {
                return;
            }

            activated = true;


            /*
             * Убираем фальшивую ошибку
             */
            errorPage.style.display = "none";


            /*
             * Показываем чёрный экран
             */
            boom.classList.add("active");


            /*
             * Запускаем 67
             */
            startRain();


            /*
             * Сбрасываем MP3
             */
            sound.currentTime = 0;

            sound.volume = 1.0;

            sound.loop = true;


            /*
             * Воспроизводим звук.
             *
             * Это разрешено браузером,
             * потому что функция вызвана
             * нажатием пользователя.
             */
            try {
                await sound.play();
            }
            catch (error) {
                console.log(
                    "Не удалось запустить MP3:",
                    error
                );
            }


            /*
             * Пытаемся перейти
             * в полноэкранный режим.
             */
            try {

                if (
                    document.documentElement.requestFullscreen
                ) {

                    await document
                        .documentElement
                        .requestFullscreen();

                }

            }
            catch (error) {

                console.log(
                    "Fullscreen недоступен"
                );

            }
        }


        /*
         * Кнопка Chrome
         */
        reloadButton.addEventListener(
            "click",
            activate
        );

    </script>

</body>
</html>
